<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hired.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,200..800;1,200..800&amp;family=Geist+Mono:wght@400;500;600&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div class="screen" style="width: 390px; height: 844px; font-family: 'Hanken Grotesk', sans-serif">
  <div class="aurora" aria-hidden="true">
    <span class="blob heat" style="width: 320px; height: 320px; left: 140px; top: -120px; opacity: 0.32"></span>
    <span class="blob signal" style="width: 260px; height: 260px; left: -140px; top: 560px; opacity: 0.14; animation-delay: -9s"></span>
  </div>
  <svg class="grain" aria-hidden="true"><filter id="grainS10"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grainS10)"></rect></svg>

  <main class="safe col" style="gap: 14px">
    <header class="row rise" style="gap: 12px">
      <a class="icon-btn" href="A01-Home.dc.html" aria-label="Back"><span class="ms">arrow_back</span></a>
      <h1 class="h1">Settings</h1>
    </header>

    <section class="glass row rise d2" style="padding: 14px 16px; gap: 14px">
      <span class="row" style="width: 48px; height: 48px; border-radius: 999px; justify-content: center; flex: none; color: var(--on-heat); background: var(--heat-1); font-family: 'Geist Mono', monospace; font-weight: 500; font-size: 17px">IR</span>
      <span class="col" style="flex: 1; gap: 1px; min-width: 0"><span style="font-size: 16px; font-weight: 600">Ishita Rao</span><span class="small" style="color: var(--text-3)">B.Tech CSE · Class of 2027 · SDE-1</span></span>
      <a class="btn btn-ghost btn-sm" href="B06-Profile-Setup.dc.html" style="padding: 0 10px">Edit</a>
    </section>

    <section class="col" style="gap: 8px" aria-label="Appearance">
      <span class="label" style="padding-left: 4px">Appearance</span>
      <div class="seg glass thin">
        <sc-for list="{{themes}}" as="t" hint-placeholder-count="3"><button type="button" class="{{t.cls}}" aria-pressed="{{t.on}}" onClick="{{t.pick}}"><span class="ms" style="font-size: 18px">{{t.icon}}</span>{{t.label}}</button></sc-for>
      </div>
    </section>

    <section class="col" style="gap: 8px" aria-label="Notifications">
      <span class="label" style="padding-left: 4px">Notifications</span>
      <div class="glass col" style="padding: 2px 16px">
        <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
          <div class="row" style="gap: 12px; height: 56px; box-shadow: {{t.divider}}">
            <span class="ms" style="color: var(--text-2)">{{t.icon}}</span>
            <span class="col" style="flex: 1; gap: 0"><span style="font-size: 15px; font-weight: 500">{{t.label}}</span><span class="small" style="font-size: 12px; color: var(--text-3)">{{t.note}}</span></span>
            <button type="button" class="{{t.cls}}" aria-pressed="{{t.on}}" aria-label="{{t.label}}" onClick="{{t.flip}}"><i></i></button>
          </div>
        </sc-for>
      </div>
    </section>

    <section class="glass col rise d2" style="padding: 2px 16px" aria-label="Account">
      <a class="row" href="C09-Pro.dc.html" style="gap: 12px; height: 54px; text-decoration: none; box-shadow: 0 1px 0 var(--hair)"><span class="ms" style="color: var(--heat-1)">bolt</span><span style="flex: 1; font-size: 15px; font-weight: 500">Hired Pro</span><span class="tag heat">Coming soon</span><span class="ms" style="color: var(--text-3); font-size: 20px">chevron_right</span></a>
      <button type="button" class="row" style="gap: 12px; height: 54px; border: 0; background: transparent; color: var(--text); font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; font-weight: 500; padding: 0; box-shadow: 0 1px 0 var(--hair)"><span class="ms" style="color: var(--text-2)">logout</span><span style="flex: 1; text-align: left">Sign out</span></button>
      <button type="button" class="row" style="gap: 12px; height: 54px; border: 0; background: transparent; color: var(--bad); font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; font-weight: 500; padding: 0"><span class="ms">delete</span><span style="flex: 1; text-align: left">Delete my data</span></button>
    </section>

    <button type="button" class="small" style="align-self: center; border: 0; background: transparent; font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--text-3); padding: 8px">Version 1.0.0</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const theme = st.theme ?? 0;
    const flags = Object.assign({ follow: true, day: true, weekly: false }, st.flags || {});
    const themes = [['Dark', 'dark_mode'], ['Light', 'light_mode'], ['System', 'contrast']].map((t, i) => ({
      label: t[0], icon: t[1], on: i === theme ? 'true' : 'false', cls: i === theme ? 'on' : '', pick: () => this.setState({ theme: i })
    }));
    const defs = [
      { key: 'follow', icon: 'schedule', label: 'Follow-up reminders', note: '5 days after you apply' },
      { key: 'day', icon: 'event', label: 'Interview-day nudge', note: 'A warm-up mock that morning' },
      { key: 'weekly', icon: 'insights', label: 'Weekly progress', note: 'Sunday evening summary' }
    ];
    const toggles = defs.map((d, i) => ({
      icon: d.icon, label: d.label, note: d.note,
      on: flags[d.key] ? 'true' : 'false',
      cls: flags[d.key] ? 'switch on' : 'switch',
      divider: i < defs.length - 1 ? '0 1px 0 var(--hair)' : 'none',
      flip: () => this.setState({ flags: Object.assign({}, flags, { [d.key]: !flags[d.key] }) })
    }));
    return { themes: themes, toggles: toggles };
  }
}
</script>
</body>
</html>
