<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analysing resume</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hired.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,200..800;1,200..800&amp;family=Geist+Mono:wght@400;500;600&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div class="screen" style="width: 390px; height: 844px; font-family: 'Hanken Grotesk', sans-serif">
  <div class="aurora" aria-hidden="true">
    <span class="blob heat" style="width: 340px; height: 340px; left: 30px; top: 150px"></span>
    <span class="blob signal" style="width: 260px; height: 260px; left: 190px; top: 330px; opacity: 0.4; animation-delay: -5s"></span>
  </div>
  <svg class="grain" aria-hidden="true"><filter id="grainC"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grainC)"></rect></svg>

  <main class="safe col" style="gap: 26px; align-items: center">
    <header class="row rise" style="width: 100%; justify-content: space-between">
      <a class="icon-btn" href="A02-Resume-Input.dc.html" aria-label="Cancel"><span class="ms">close</span></a>
      <span class="small" style="color: var(--text-3)">About 8 seconds</span>
      <span style="width: 44px"></span>
    </header>

    <h1 class="h1" style="text-align: center; font-size: 28px; line-height: 33px; max-width: 300px">Comparing you with <em>Razorpay's SDE-1</em> role</h1>

    <div style="position: relative; width: 300px; height: 300px" aria-hidden="true">
      <div class="glass col" style="position: absolute; left: 50px; top: 10px; width: 200px; height: 270px; padding: 22px 20px; gap: 11px; overflow: hidden; border-radius: 16px">
        <span style="width: 70%; height: 10px; border-radius: 6px; background: var(--text); opacity: 0.8"></span>
        <span style="width: 45%; height: 7px; border-radius: 6px; background: var(--text-3)"></span>
        <span style="height: 6px"></span>
        <span style="width: 100%; height: 6px; border-radius: 6px; background: var(--track)"></span>
        <span style="width: 92%; height: 6px; border-radius: 6px; background: var(--track)"></span>
        <span style="width: 84%; height: 6px; border-radius: 6px; background: rgba(124, 227, 139, 0.5)"></span>
        <span style="width: 96%; height: 6px; border-radius: 6px; background: var(--track)"></span>
        <span style="height: 4px"></span>
        <span style="width: 100%; height: 6px; border-radius: 6px; background: var(--track)"></span>
        <span style="width: 70%; height: 6px; border-radius: 6px; background: rgba(255, 99, 99, 0.5)"></span>
        <span style="width: 88%; height: 6px; border-radius: 6px; background: var(--track)"></span>
        <span style="width: 94%; height: 6px; border-radius: 6px; background: rgba(124, 227, 139, 0.5)"></span>
        <span style="width: 60%; height: 6px; border-radius: 6px; background: var(--track)"></span>
        <div class="scanline" style="position: absolute; left: 0; right: 0; top: 10px; height: 46px; background: linear-gradient(rgba(255, 122, 47, 0), rgba(255, 122, 47, 0.35) 60%, rgba(255, 220, 190, 0.95) 62%, rgba(255, 122, 47, 0) 64%); mix-blend-mode: screen"></div>
      </div>
      <span class="tag ok rise" style="position: absolute; left: 0; top: 42px; height: 30px; padding: 0 12px; font-size: 12px; animation-delay: 0.4s"><span class="ms" style="font-size: 15px">check</span>Java</span>
      <span class="tag ok rise" style="position: absolute; right: 0; top: 86px; height: 30px; padding: 0 12px; font-size: 12px; animation-delay: 1.1s"><span class="ms" style="font-size: 15px">check</span>REST APIs</span>
      <span class="tag bad rise" style="position: absolute; left: 4px; top: 176px; height: 30px; padding: 0 12px; font-size: 12px; animation-delay: 1.8s"><span class="ms" style="font-size: 15px">close</span>Kubernetes</span>
      <span class="tag ok rise" style="position: absolute; right: 10px; top: 214px; height: 30px; padding: 0 12px; font-size: 12px; animation-delay: 2.4s"><span class="ms" style="font-size: 15px">check</span>SQL</span>
      <span class="tag bad rise" style="position: absolute; left: 96px; top: 270px; height: 30px; padding: 0 12px; font-size: 12px; animation-delay: 3s"><span class="ms" style="font-size: 15px">close</span>Kafka</span>
    </div>

    <ol class="glass col" style="width: 100%; margin: 0; padding: 18px 20px; list-style: none; gap: 16px" aria-label="Analysis progress" aria-live="polite">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <li class="row" style="gap: 14px; font-size: 15px; font-weight: 600">
          <sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><span class="row" style="width: 26px; height: 26px; border-radius: 999px; justify-content: center; background: rgba(124, 227, 139, 0.16); color: var(--ok)"><span class="ms" style="font-size: 17px">check</span></span></sc-if>
          <sc-if value="{{s.active}}" hint-placeholder-val="{{false}}"><span class="row" style="width: 26px; height: 26px; justify-content: center; color: var(--heat-1)"><span class="ms" style="font-size: 24px; animation: spin 1s linear infinite">progress_activity</span></span></sc-if>
          <sc-if value="{{s.waiting}}" hint-placeholder-val="{{true}}"><span class="row" style="width: 26px; height: 26px; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 999px; background: var(--track)"></span></span></sc-if>
          <span class="{{s.textClass}}" style="flex: 1">{{s.label}}</span>
          <span class="small" style="color: var(--text-3)">{{s.meta}}</span>
        </li>
      </sc-for>
    </ol>
  </main>

  <sc-if value="{{finished}}" hint-placeholder-val="{{false}}">
    <div class="dock rise">
      <a class="btn btn-heat" href="A04-Resume-Result.dc.html" style="flex: 1">See your match<span class="ms">arrow_forward</span></a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.setState({ stage: 1 });
    this.timer = setInterval(() => {
      const next = ((this.state && this.state.stage) || 1) + 1;
      this.setState({ stage: next });
      if (next >= 4) clearInterval(this.timer);
    }, 1700);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    // stage 1..3 = that step is running; 4 = all done
    const stage = (this.state && this.state.stage) || 1;
    const labels = [
      ['Reading your resume', '14 skills'],
      ['Comparing with the JD', '9 required'],
      ['Writing your fixes', '5 fixes']
    ];
    const steps = labels.map((l, i) => {
      const done = i < stage - 1;
      const active = i === stage - 1;
      return {
        label: l[0],
        meta: done ? l[1] : '',
        done: done,
        active: active,
        waiting: !done && !active,
        textClass: active ? 'shimmer' : ''
      };
    });
    return { steps: steps, finished: stage >= 4 };
  }
}
</script>
</body>
</html>
