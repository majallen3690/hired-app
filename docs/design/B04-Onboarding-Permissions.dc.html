<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding: permissions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hired.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,200..800;1,200..800&amp;family=Geist+Mono:wght@400;500;600&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div class="screen" style="width: 390px; height: 844px; font-family: 'Hanken Grotesk', sans-serif">
  <div class="aurora" aria-hidden="true">
    <span class="blob signal" style="width: 340px; height: 340px; left: 120px; top: 60px; opacity: 0.5"></span>
    <span class="blob heat" style="width: 320px; height: 320px; left: -150px; top: 360px; animation-delay: -7s"></span>
  </div>
  <svg class="grain" aria-hidden="true"><filter id="grainN"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grainN)"></rect></svg>

  <main class="safe col" style="gap: 14px; padding-top: 108px">
    <h1 class="h1" style="font-size: 38px; line-height: 41px">Two quick <em>permissions.</em></h1>
    <p class="body" style="font-size: 16px; line-height: 24px; margin-bottom: 8px">The mock interview needs to hear and see you. Here is exactly what happens to each.</p>

    <sc-for list="{{perms}}" as="p" hint-placeholder-count="3">
      <div class="glass row" style="padding: 16px; gap: 14px; border-radius: 18px; align-items: flex-start">
        <span class="row" style="width: 46px; height: 46px; border-radius: 15px; justify-content: center; flex: none; background: {{p.tint}}; color: {{p.color}}"><span class="ms fill">{{p.icon}}</span></span>
        <span class="col" style="flex: 1; gap: 3px">
          <span class="row" style="justify-content: space-between; gap: 8px"><span style="font-size: 16px; font-weight: 600">{{p.title}}</span><span class="small" style="color: var(--text-3)">{{p.req}}</span></span>
          <span class="small">{{p.text}}</span>
          <button type="button" class="{{p.btnClass}}" onClick="{{p.toggle}}" aria-pressed="{{p.pressed}}" style="align-self: flex-start; margin-top: 8px; height: 38px; padding: 0 16px; font-size: 14px"><span class="ms" style="font-size: 18px">{{p.btnIcon}}</span>{{p.btnLabel}}</button>
        </span>
      </div>
    </sc-for>
  </main>

  <div class="col" style="position: absolute; left: 24px; right: 24px; bottom: 40px; gap: 18px">
    <div class="row" style="justify-content: space-between">
      <span class="row" style="gap: 6px" aria-label="Page 3 of 3"><span style="width: 6px; height: 6px; border-radius: 999px; background: var(--text-3)"></span><span style="width: 6px; height: 6px; border-radius: 999px; background: var(--text-3)"></span><span style="width: 24px; height: 6px; border-radius: 999px; background: var(--text)"></span></span>
      <a class="btn btn-heat" href="B05-Sign-In.dc.html">Continue<span class="ms">arrow_forward</span></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const defs = [
      { key: 'mic', icon: 'mic', title: 'Microphone', req: 'Needed', tint: 'rgba(255, 122, 47, 0.18)', color: 'var(--heat-1)', text: 'So the AI interviewer can hear you. Audio is only used during a mock.' },
      { key: 'cam', icon: 'videocam', title: 'Camera', req: 'Needed', tint: 'rgba(79, 240, 210, 0.16)', color: 'var(--signal)', text: 'Eye contact is measured on your phone. Live video is never uploaded.' },
      { key: 'notif', icon: 'notifications', title: 'Reminders', req: 'Optional', tint: 'rgba(255, 255, 255, 0.08)', color: 'var(--text)', text: 'A nudge to follow up 5 days after you apply, and on interview day.' }
    ];
    const perms = defs.map((d) => {
      const on = !!st[d.key];
      return Object.assign({}, d, {
        pressed: on ? 'true' : 'false',
        btnClass: on ? 'btn btn-glass' : 'btn btn-heat',
        btnIcon: on ? 'check' : 'lock_open',
        btnLabel: on ? 'Allowed' : 'Allow',
        toggle: () => this.setState({ [d.key]: !on })
      });
    });
    return { perms: perms };
  }
}
</script>
</body>
</html>
