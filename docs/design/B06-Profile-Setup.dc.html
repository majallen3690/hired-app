<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile setup</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hired.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,200..800;1,200..800&amp;family=Geist+Mono:wght@400;500;600&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div class="screen" style="width: 390px; height: 844px; font-family: 'Hanken Grotesk', sans-serif">
  <div class="aurora" aria-hidden="true">
    <span class="blob pink" style="width: 320px; height: 320px; left: 170px; top: -100px"></span>
    <span class="blob heat" style="width: 300px; height: 300px; left: -150px; top: 500px; opacity: 0.5; animation-delay: -8s"></span>
  </div>
  <svg class="grain" aria-hidden="true"><filter id="grainP"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grainP)"></rect></svg>

  <main class="safe col" style="gap: 20px">
    <header class="row rise" style="gap: 12px">
      <a class="icon-btn" href="B05-Sign-In.dc.html" aria-label="Back"><span class="ms">arrow_back</span></a>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" aria-label="Step 2 of 3">
        <span style="height: 5px; border-radius: 999px; background: linear-gradient(90deg, var(--heat-1), var(--heat-2))"></span>
        <span style="height: 5px; border-radius: 999px; background: linear-gradient(90deg, var(--heat-1), var(--heat-2))"></span>
        <span style="height: 5px; border-radius: 999px; background: var(--track)"></span>
      </div>
    </header>

    <div class="col" style="gap: 6px">
      <h1 class="h1" style="font-size: 32px; line-height: 36px">Tell us where you're <em>headed</em></h1>
      <p class="body">This shapes your questions, keywords and score.</p>
    </div>

    <div class="col" style="gap: 8px">
      <label class="label" for="p-role">Target role</label>
      <input id="p-role" class="field focus" type="text" value="Software Engineer · SDE-1">
    </div>

    <div class="col" style="gap: 8px">
      <span class="label">Degree and branch</span>
      <div class="row" style="gap: 8px; flex-wrap: wrap">
        <sc-for list="{{branches}}" as="o" hint-placeholder-count="4"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for>
      </div>
    </div>

    <div class="col" style="gap: 8px">
      <span class="label">Graduating in</span>
      <div class="seg glass thin">
        <sc-for list="{{years}}" as="o" hint-placeholder-count="4"><button type="button" class="{{o.segCls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for>
      </div>
    </div>

    <div class="col" style="gap: 8px">
      <span class="label">Dream companies</span>
      <div class="row" style="gap: 8px; flex-wrap: wrap">
        <span class="chip on" style="padding-right: 6px">Google<button type="button" aria-label="Remove Google" style="width: 26px; height: 26px; border: 0; border-radius: 999px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 16px">close</span></button></span>
        <span class="chip on" style="padding-right: 6px">Razorpay<button type="button" aria-label="Remove Razorpay" style="width: 26px; height: 26px; border: 0; border-radius: 999px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 16px">close</span></button></span>
        <span class="chip on" style="padding-right: 6px">Zoho<button type="button" aria-label="Remove Zoho" style="width: 26px; height: 26px; border: 0; border-radius: 999px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><span class="ms" style="font-size: 16px">close</span></button></span>
        <button type="button" class="chip" style="color: var(--heat-1)"><span class="ms" style="font-size: 18px">add</span>Add</button>
      </div>
      <span class="small" style="color: var(--text-3)">Popular with your batch: Swiggy, Atlassian, Freshworks</span>
    </div>
  </main>

  <div class="dock">
    <a class="btn btn-heat" href="A01-Home.dc.html" style="flex: 1">Continue<span class="ms">arrow_forward</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const b = st.branch ?? 0;
    const y = st.year ?? 1;
    const branches = ['B.Tech CSE', 'B.Tech IT', 'B.Tech ECE', 'MCA'].map((l, i) => ({
      label: l, on: i === b ? 'true' : 'false', cls: i === b ? 'chip on' : 'chip', pick: () => this.setState({ branch: i })
    }));
    const years = ['2026', '2027', '2028', '2029'].map((l, i) => ({
      label: l, on: i === y ? 'true' : 'false', segCls: i === y ? 'on' : '', pick: () => this.setState({ year: i })
    }));
    return { branches: branches, years: years };
  }
}
</script>
</body>
</html>
