<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splash</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hired.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,200..800;1,200..800&amp;family=Geist+Mono:wght@400;500;600&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div class="screen col" style="width: 390px; height: 844px; font-family: 'Hanken Grotesk', sans-serif; align-items: center; justify-content: center; gap: 22px">
  <div class="aurora" aria-hidden="true">
    <span class="blob heat" style="width: 420px; height: 420px; left: -20px; top: 220px; opacity: 0.8"></span>
    <span class="blob pink" style="width: 300px; height: 300px; left: 170px; top: 120px; animation-delay: -5s"></span>
    <span class="blob signal" style="width: 260px; height: 260px; left: -120px; top: 560px; opacity: 0.3; animation-delay: -9s"></span>
  </div>
  <svg class="grain" aria-hidden="true"><filter id="grainK"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grainK)"></rect></svg>

  <svg class="rise" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Hired logo" style="overflow: visible">
    <defs>
      <linearGradient id="logoK" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: var(--heat-1)"></stop><stop offset="1" style="stop-color: var(--heat-2)"></stop></linearGradient>
      <filter id="glowK" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter>
    </defs>
    <circle cx="60" cy="60" r="44" fill="none" stroke="url(#logoK)" stroke-width="16" stroke-linecap="round" stroke-dasharray="207 277" transform="rotate(-90 60 60)" filter="url(#glowK)" opacity="0.8"></circle>
    <circle cx="60" cy="60" r="44" fill="none" stroke="url(#logoK)" stroke-width="16" stroke-linecap="round" stroke-dasharray="207 277" transform="rotate(-90 60 60)"></circle>
    <circle cx="16" cy="60" r="8" style="fill: var(--text)"></circle>
  </svg>
  <div class="col rise" style="align-items: center; gap: 8px; animation-delay: 150ms">
    <span class="display" style="font-size: 64px; line-height: 64px; font-weight: 600; letter-spacing: -0.05em">hired</span>
    <span class="body">Your placement coach, in your pocket.</span>
  </div>
  <span class="small" style="position: absolute; bottom: 44px; color: var(--text-3)">Version 1.0</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
