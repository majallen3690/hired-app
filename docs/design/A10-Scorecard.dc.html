<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shareable scorecard</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./hired.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,200..800;1,200..800&amp;family=Geist+Mono:wght@400;500;600&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div class="screen col" style="width: 540px; height: 960px; font-family: 'Hanken Grotesk', sans-serif; padding: 56px 44px 48px; align-items: center">
  <div class="aurora" aria-hidden="true">
    <span class="blob heat" style="width: 560px; height: 560px; left: -40px; top: 120px; opacity: 0.85"></span>
    <span class="blob pink" style="width: 420px; height: 420px; left: 260px; top: -60px"></span>
    <span class="blob signal" style="width: 380px; height: 380px; left: -200px; top: 640px; opacity: 0.35"></span>
  </div>
  <svg class="grain" aria-hidden="true"><filter id="grainJ"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#grainJ)"></rect></svg>

  <div class="row" style="width: 100%; justify-content: space-between">
    <span class="row" style="gap: 10px">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><defs><linearGradient id="logoJ" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: var(--heat-1)"></stop><stop offset="1" style="stop-color: var(--heat-2)"></stop></linearGradient></defs><circle cx="17" cy="17" r="12" fill="none" stroke="url(#logoJ)" stroke-width="5" stroke-linecap="round" stroke-dasharray="56 76" transform="rotate(-90 17 17)"></circle><circle cx="5" cy="17" r="2.6" style="fill: var(--text)"></circle></svg>
      <span class="display" style="font-size: 30px; font-weight: 600; letter-spacing: -0.04em">hired</span>
    </span>
    <span class="small" style="font-weight: 600">31 Oct 2026</span>
  </div>

  <div style="position: relative; width: 380px; height: 380px; margin-top: 54px">
    <svg width="380" height="380" viewBox="0 0 380 380" style="position: absolute; left: 0; top: 0" role="img" aria-label="Placement readiness 68 out of 100: resume 74, interview 66, speaking 62, presence 66">
      <g transform="rotate(-90 190 190)" fill="none" stroke-width="26">
        <circle cx="190" cy="190" r="166" style="stroke: var(--track)" stroke-dasharray="{{track}}" stroke-dashoffset="{{q0.off}}"></circle>
        <circle cx="190" cy="190" r="166" style="stroke: var(--track)" stroke-dasharray="{{track}}" stroke-dashoffset="{{q1.off}}"></circle>
        <circle cx="190" cy="190" r="166" style="stroke: var(--track)" stroke-dasharray="{{track}}" stroke-dashoffset="{{q2.off}}"></circle>
        <circle cx="190" cy="190" r="166" style="stroke: var(--track)" stroke-dasharray="{{track}}" stroke-dashoffset="{{q3.off}}"></circle>
        <circle cx="190" cy="190" r="166" style="stroke: var(--text)" stroke-dasharray="{{q0.dash}}" stroke-dashoffset="{{q0.off}}"></circle>
        <circle cx="190" cy="190" r="166" style="stroke: var(--heat-1)" stroke-dasharray="{{q1.dash}}" stroke-dashoffset="{{q1.off}}"></circle>
        <circle cx="190" cy="190" r="166" style="stroke: var(--text)" stroke-dasharray="{{q2.dash}}" stroke-dashoffset="{{q2.off}}"></circle>
        <circle cx="190" cy="190" r="166" style="stroke: var(--text)" stroke-dasharray="{{q3.dash}}" stroke-dashoffset="{{q3.off}}"></circle>
      </g>
    </svg>
    <div class="col" style="position: absolute; inset: 0; align-items: center; justify-content: center">
      <span class="label" style="font-size: 14px; color: var(--text-2)">Placement readiness</span>
      <span class="num" style="font-size: 140px; line-height: 150px">68</span>
      <span class="tag ok" style="height: 32px; padding: 0 14px; font-size: 15px"><span class="ms" style="font-size: 18px">arrow_upward</span>20 in 3 weeks</span>
    </div>
  </div>

  <div class="col" style="align-items: center; gap: 4px; margin-top: 40px">
    <span class="display" style="font-size: 34px; line-height: 40px">Ishita Rao</span>
    <span class="body" style="font-size: 18px">B.Tech CSE · Class of 2027 · aiming for SDE-1</span>
  </div>

  <div class="glass row" style="width: 100%; margin-top: 34px; padding: 22px 24px; gap: 18px; border-radius: 20px">
    <span class="row" style="width: 60px; height: 60px; border-radius: 999px; justify-content: center; color: var(--on-heat); background: var(--heat-1)"><span class="ms fill" style="font-size: 30px">mic</span></span>
    <span class="col" style="flex: 1; gap: 2px">
      <span class="label">Best this week</span>
      <span style="font-size: 23px; line-height: 29px; font-weight: 600">Interview score up 16 points</span>
    </span>
  </div>

  <div style="width: 100%; margin-top: 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
    <div class="glass thin col" style="border-radius: 16px; padding: 14px; gap: 2px; align-items: center"><span class="num" style="font-size: 34px">74</span><span class="small">Resume</span></div>
    <div class="glass thin col" style="border-radius: 16px; padding: 14px; gap: 2px; align-items: center"><span class="num" style="font-size: 34px">66</span><span class="small">Interview</span></div>
    <div class="glass thin col" style="border-radius: 16px; padding: 14px; gap: 2px; align-items: center"><span class="num" style="font-size: 34px">62</span><span class="small">Speaking</span></div>
    <div class="glass thin col" style="border-radius: 16px; padding: 14px; gap: 2px; align-items: center"><span class="num" style="font-size: 34px">66</span><span class="small">Presence</span></div>
  </div>

  <span class="small" style="margin-top: auto; font-size: 15px; color: var(--text-3)">Made with Hired, the AI placement coach</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    // Same 60-tick dial as Home: 4 arcs of 14 ticks. The arc that grew this week is lit in ember.
    const period = (2 * Math.PI * 166) / 60;
    const tick = 5;
    const pair = tick + ' ' + (period - tick).toFixed(3) + ' ';
    const ticks = (n) => { let out = ''; for (let i = 0; i < n; i++) out += pair; return out + '0 2000'; };
    const q = [74, 66, 62, 66].map((s, i) => ({
      off: (-((i * 15 + 1) * period - tick / 2)).toFixed(2),
      dash: ticks(Math.round((14 * s) / 100))
    }));
    return { track: ticks(14), q0: q[0], q1: q[1], q2: q[2], q3: q[3] };
  }
}
</script>
</body>
</html>
