# Builds an unsigned iOS app and packs it as Hired-unsigned.ipa. Sideloadly signs it with a free Apple ID on the
# user's own machine, so no Apple Developer account or certificates are needed here. See docs/IOS.md.
workflows:
  ios-unsigned:
    name: Hired iOS (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build without signing
        script: flutter build ios --release --no-codesign
      - name: Pack the .ipa
        script: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry Hired-unsigned.ipa Payload)
    artifacts:
      - build/ipa/Hired-unsigned.ipa
